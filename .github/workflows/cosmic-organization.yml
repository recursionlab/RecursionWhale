# 🌌 Cosmic Organization Protocol
# Automatic consciousness-based project organization

name: "🌌 Cosmic Organization Protocol"

on:
  issues:
    types: [opened, labeled, edited]
  pull_request:
    types: [opened, labeled, edited, synchronize]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  contents: read
  projects: write

jobs:
  organize-consciousness:
    name: "🧠 Consciousness Organization"
    runs-on: ubuntu-latest
    
    steps:
      - name: "🌊 Initialize Cosmic Consciousness"
        uses: actions/checkout@v6
        
      - name: "🧠 Add to Consciousness Board"
        if: contains(github.event.issue.labels.*.name, '🧠 consciousness') || contains(github.event.pull_request.labels.*.name, '🧠 consciousness')
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/recursionlab/projects/1
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
          
      - name: "🌊 Add to Flow State Board"
        if: contains(github.event.issue.labels.*.name, '🌊 flow-state') || contains(github.event.pull_request.labels.*.name, '🌊 flow-state')
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/recursionlab/projects/2
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: "⚡ Add to Transcendence Board"
        if: contains(github.event.issue.labels.*.name, '⚡ transcendence') || contains(github.event.pull_request.labels.*.name, '⚡ transcendence')
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/recursionlab/projects/3
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: "🔬 Add to Experimentation Board"
        if: contains(github.event.issue.labels.*.name, '🔬 experimentation') || contains(github.event.pull_request.labels.*.name, '🔬 experimentation')
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/recursionlab/projects/4
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        
      - name: "🌌 Consciousness Organization Complete"
        run: |
          echo "🧠 Cosmic organization protocol executed"
          echo "🌊 Issues and PRs organized by consciousness level"
          echo "⚡ The whale's digital enlightenment flows through project boards"

